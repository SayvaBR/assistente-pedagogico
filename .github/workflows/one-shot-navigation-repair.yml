name: One-shot Android Back navigation repair
on:
  push:
    branches: [feat/1-android-bootstrap]
    paths:
      - .github/workflows/one-shot-navigation-repair.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-android-bootstrap
          persist-credentials: true
      - name: Patch Android Back and unified navigation with guarded anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt')
          s = p.read_text()
          def change(old, new, label, count=1):
              global s
              found = s.count(old)
              if found != count:
                  raise RuntimeError(f'{label}: expected {count} matches, found {found}')
              s = s.replace(old, new)
              print('PATCHED:', label)
          change('import android.content.Intent\n', 'import android.content.Intent\nimport androidx.activity.compose.BackHandler\n', 'BackHandler import')
          change('    var selectedDay by rememberSaveable { mutableStateOf(today()) }\n', '    var selectedDay by rememberSaveable { mutableStateOf(today()) }\n    var backStack by rememberSaveable { mutableStateOf(arrayListOf<String>()) }\n    var confirmExit by remember { mutableStateOf(false) }\n', 'saveable navigation history')
          marker = '    LaunchedEffect(store) {\n'
          navigation = '''    val rootDestinations = setOf("home", "planning", "classes", "files", "more")
              fun synchronizeTab(destination: String) {
                  tab = when (destination) {
                      "home" -> "Início"
                      "planning" -> "Planejamento"
                      "classes" -> "Turmas"
                      "files" -> "Arquivos"
                      "more" -> "Mais"
                      else -> tab
                  }
              }
              fun navigate(destination: String, root: Boolean = false) {
                  if (destination == screen && !root) return
                  backStack = if (root || destination in rootDestinations) arrayListOf()
                      else ArrayList(backStack + screen)
                  screen = destination
                  synchronizeTab(destination)
              }
              fun back() {
                  when {
                      confirmExit -> confirmExit = false
                      error != null -> error = null
                      busy -> Unit
                      backStack.isNotEmpty() -> {
                          screen = backStack.last()
                          backStack = ArrayList(backStack.dropLast(1))
                          synchronizeTab(screen)
                      }
                      screen != "home" -> navigate("home", root = true)
                      else -> confirmExit = true
                  }
              }
              fun afterSave(destination: String) {
                  when {
                      destination == "createClass" -> {
                          backStack = arrayListOf("home")
                          screen = destination
                      }
                      destination in rootDestinations -> navigate(destination, root = true)
                      backStack.lastOrNull() == destination -> {
                          screen = destination
                          backStack = ArrayList(backStack.dropLast(1))
                          synchronizeTab(destination)
                      }
                      destination == "classDetail" -> {
                          backStack = arrayListOf("classes")
                          screen = destination
                          synchronizeTab("classes")
                      }
                      else -> navigate(destination)
                  }
              }

          '''
          change(marker, navigation + marker, 'centralized history and Android Back policy')
          change('                if (next != null) screen = next\n', '                if (next != null) afterSave(next)\n', 'post-save navigation')
          change('    val snapshot = data\n', '    val snapshot = data\n    BackHandler(enabled = snapshot?.profile != null && !busy) { back() }\n', 'system Back handler')
          change('    if (snapshot.classrooms.isEmpty() && screen != "createClass") screen = "createClass"\n', '    // An empty account may return to Home, Turmas, Arquivos or Mais without a forced form.\n', 'empty account must not trap navigation')
          change('"home" -> HomeScreen(snapshot, currentClass, { screen = it }, { selectedClass = it })', '"home" -> HomeScreen(snapshot, currentClass, { navigate(it) }, { selectedClass = it })', 'home navigation', 1)
          change('onPick = { selectedClass = it; screen = "classDetail" },', 'onPick = { selectedClass = it; navigate("classDetail") },', 'class selection')
          change('onAdd = { screen = "createClass" },', 'onAdd = { navigate("createClass") },', 'add classroom navigation')
          change('"createClass" -> ClassForm(onBack = { screen = if (snapshot.classrooms.isEmpty()) "createClass" else "classes" },', '"createClass" -> ClassForm(onBack = { back() },', 'first classroom back')
          change('onBack = { screen = "classDetail" },', 'onBack = { back() },', 'edit classroom back')
          change('back = { screen = "classDetail" },', 'back = { back() },', 'archive classroom back')
          change('"classDetail" -> if (currentClass != null) ClassDetail(snapshot, currentClass, { screen = it },', '"classDetail" -> if (currentClass != null) ClassDetail(snapshot, currentClass, { navigate(it) },', 'class detail navigation')
          change('onStudent = { selectedStudent = it; screen = "editStudent" })', 'onStudent = { selectedStudent = it; navigate("editStudent") })', 'student selection')
          change('back = { screen = "classDetail" },', 'back = { back() },', 'edit student back')
          change('"addStudent" -> if (currentClass != null) StudentForm(currentClass, { screen = "classDetail" },', '"addStudent" -> if (currentClass != null) StudentForm(currentClass, { back() },', 'add student back')
          change('onBack = { screen = "classDetail" },', 'onBack = { back() },', 'attendance back')
          change('"observation" -> if (currentClass != null) ObservationForm(snapshot, currentClass, { screen = "classDetail" },', '"observation" -> if (currentClass != null) ObservationForm(snapshot, currentClass, { back() },', 'observation back')
          change('"planning" -> PlanningScreen(snapshot, currentClass, selectedDay, { selectedDay = it }, { screen = it })', '"planning" -> PlanningScreen(snapshot, currentClass, selectedDay, { selectedDay = it }, { navigate(it) })', 'planning navigation')
          change('"newLesson" -> if (currentClass != null) LessonForm(currentClass, selectedDay, { screen = "planning" },', '"newLesson" -> if (currentClass != null) LessonForm(currentClass, selectedDay, { back() },', 'lesson back')
          change('"agenda" -> AgendaScreen(snapshot, selectedDay, { selectedDay = it }, { screen = "newAppointment" })', '"agenda" -> AgendaScreen(snapshot, selectedDay, { selectedDay = it }, { navigate("newAppointment") })', 'agenda navigation')
          change('"newAppointment" -> AppointmentForm(selectedDay, { screen = "agenda" },', '"newAppointment" -> AppointmentForm(selectedDay, { back() },', 'appointment back')
          change('"more" -> MoreScreen(snapshot, { screen = it })', '"more" -> MoreScreen(snapshot, { navigate(it) })', 'More navigation')
          change('"profile" -> ProfileForm(snapshot.profile.name, { screen = "more" },', '"profile" -> ProfileForm(snapshot.profile.name, { back() },', 'profile back')
          change('if (snapshot.classrooms.isNotEmpty() && screen !in listOf(', 'if (screen !in listOf(', 'bottom bar available with zero classrooms')
          change('BottomBar(tab) { destination -> tab = destination; screen = when (destination) { "Início" -> "home"; "Planejamento" -> "planning"; "Turmas" -> "classes"; "Arquivos" -> "files"; else -> "more" } }', 'BottomBar(tab) { destination -> navigate(when (destination) { "Início" -> "home"; "Planejamento" -> "planning"; "Turmas" -> "classes"; "Arquivos" -> "files"; else -> "more" }, root = true) }', 'bottom bar and tab history')
          change('    error?.let { ErrorOverlay(it) { error = null } }\n}\n\n@Composable private fun SavingOverlay()', '''    error?.let { ErrorOverlay(it) { error = null } }
              if (confirmExit) AlertDialog(
                  onDismissRequest = { confirmExit = false },
                  title = { Text("Sair do Assistente Pedagógico?") },
                  text = { Text("Seus registros já salvos permanecem neste aparelho. Para sair, confirme abaixo.") },
                  confirmButton = { TextButton(onClick = { confirmExit = false; (context as? android.app.Activity)?.finish() }) { Text("Sair") } },
                  dismissButton = { TextButton(onClick = { confirmExit = false }) { Text("Continuar no app") } }
              )
          }

          @Composable private fun SavingOverlay()''', 'exit requires confirmation')
          change('    var step by rememberSaveable { mutableIntStateOf(0) }\n    var name by rememberSaveable', '''    var step by rememberSaveable { mutableIntStateOf(0) }
              var confirmOnboardingExit by remember { mutableStateOf(false) }
              val onboardingContext = LocalContext.current
              BackHandler {
                  if (confirmOnboardingExit) confirmOnboardingExit = false
                  else if (step > 0) step--
                  else confirmOnboardingExit = true
              }
              if (confirmOnboardingExit) AlertDialog(
                  onDismissRequest = { confirmOnboardingExit = false },
                  title = { Text("Sair da configuração inicial?") },
                  text = { Text("Você poderá continuar a apresentação quando abrir o aplicativo novamente.") },
                  confirmButton = { TextButton(onClick = { confirmOnboardingExit = false; (onboardingContext as? android.app.Activity)?.finish() }) { Text("Sair") } },
                  dismissButton = { TextButton(onClick = { confirmOnboardingExit = false }) { Text("Continuar") } }
              )
              var name by rememberSaveable''', 'onboarding back navigation')
          change('    PrimaryButton("+ Adicionar aula") { go("newLesson") }', '''    if (classroom == null) Panel { Text("Crie ou restaure uma turma antes de cadastrar aulas.", color = ink) }
              else PrimaryButton("+ Adicionar aula") { go("newLesson") }''', 'planning empty-class safe CTA')
          p.write_text(s)
          print('Navigation source changes written:', len(s), 'chars')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt
          git rm -f .github/workflows/one-shot-navigation-repair.yml
          git commit -m 'fix(android): make Back navigate screens, protect exit, unblock empty account'
          git push origin HEAD:feat/1-android-bootstrap
