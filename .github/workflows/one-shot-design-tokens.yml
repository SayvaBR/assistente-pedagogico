name: One-shot approved design tokens
on:
  push:
    branches: [feat/1-android-bootstrap]
    paths: ['.github/workflows/one-shot-design-tokens.yml']
permissions:
  contents: write
jobs:
  align-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-android-bootstrap
          persist-credentials: true
      - name: Apply deterministic theme and reusable component patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          theme = Path('app/src/main/java/com/sayvabr/assistentepedagogico/ui/ApTheme.kt')
          src = theme.read_text(encoding='utf-8')
          rules = [
            ('val Canvas = Color(0xFFF7F7FB)', 'val Canvas = Sky'),
            ('onPrimary = ApColors.Navy,', 'onPrimary = ApColors.White,'),
          ]
          for old,new in rules:
              assert src.count(old)==1, f'{theme} expected single {old}: found {src.count(old)}'
              src=src.replace(old,new,1)
          theme.write_text(src,encoding='utf-8')
          ui = Path('app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt')
          src=ui.read_text(encoding='utf-8')
          old_palette='''private val ink = Color(0xFF102A56)
          private val blue = Color(0xFF098EED)
          private val canvas = Color(0xFFEAF8FF)
          private val pale = Color(0xFFDDF4FF)
          private val outline = Color(0xFFCDE8F8)
          private val green = Color(0xFF16865C)
          private val red = Color(0xFFB93653)'''
          new_palette='''private val ink = ApColors.Navy
          private val blue = ApColors.Primary
          private val canvas = ApColors.Sky
          private val pale = Color(0xFFEAF8FF)
          private val outline = Color(0xFFCDE8F8)
          private val green = ApColors.Pressed
          private val red = ApColors.Navy'''
          old_button='''@Composable private fun PrimaryButton(label: String, secondary: Boolean = false, click: () -> Unit) {
              Button(onClick = click, modifier = Modifier.fillMaxWidth().height(54.dp), shape = RoundedCornerShape(17.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = if (secondary) pale else blue, contentColor = if (secondary) ink else Color.White)) {
                  Text(label, fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)
              }
          }'''
          new_button='''@Composable private fun PrimaryButton(label: String, secondary: Boolean = false, click: () -> Unit) {
              Box(
                  Modifier.fillMaxWidth().height(58.dp)
                      .background(if (secondary) outline else ApColors.Pressed, RoundedCornerShape(18.dp))
                      .padding(bottom = 5.dp)
              ) {
                  Button(onClick = click, modifier = Modifier.fillMaxSize(), shape = RoundedCornerShape(17.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = if (secondary) pale else blue, contentColor = if (secondary) ink else Color.White)) {
                      Text(label, fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)
                  }
              }
          }'''
          for old,new in [(old_palette,new_palette),(old_button,new_button)]:
              assert src.count(old)==1, f'{ui} expected exact match: found {src.count(old)}'
              src=src.replace(old,new,1)
          ui.write_text(src,encoding='utf-8')
          print('Applied blue-white reference palette, theme contrast and tactile primary button')
          PY
      - name: Commit actual Kotlin changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt app/src/main/java/com/sayvabr/assistentepedagogico/ui/ApTheme.kt
          git commit -m 'feat(ui): align reference palette and add tactile blue buttons'
          git push origin HEAD:feat/1-android-bootstrap
