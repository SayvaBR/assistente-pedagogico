name: One-shot agenda CRUD implementation
on:
  push:
    branches: [feat/1-android-bootstrap]
    paths: [.github/workflows/one-shot-agenda-crud.yml]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-android-bootstrap
      - name: Apply guarded appointment CRUD patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          store = Path('app/src/main/java/com/sayvabr/assistentepedagogico/data/TeacherStore.kt')
          ui = Path('app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt')
          s = store.read_text()
          t = ui.read_text()
          def replace(src, old, new, label):
              matches = src.count(old)
              if matches != 1:
                  raise RuntimeError(f'{label}: expected exactly one anchor, found {matches}')
              print('PATCH:', label)
              return src.replace(old, new, 1)
          s = replace(s, 'import java.time.LocalDate\n', 'import java.time.LocalDate\nimport java.time.LocalTime\n', 'appointment local-time import')
          s = replace(s, '        require(Regex("\\\\d{2}:\\\\d{2}").matches(time)) { "Horário inválido: use HH:MM." }\n        writableDatabase.insertOrThrow("appointments",', '        LocalTime.parse(time)\n        writableDatabase.insertOrThrow("appointments",', 'strict appointment time validation')
          s = replace(s, '    /** Renames the app catalog entry only; the original SAF document is never modified. */', '''    /** Keeps the same record ID when changing a commitment, including its date. */
              fun updateAppointment(appointmentId: Long, title: String, day: String, time: String) {
                  require(title.trim().isNotEmpty()) { "Informe o compromisso." }
                  LocalDate.parse(day)
                  LocalTime.parse(time)
                  val changed = writableDatabase.update("appointments", values("title" to title.trim(), "day" to day, "time" to time), "id=?", arrayOf(appointmentId.toString()))
                  require(changed == 1) { "Compromisso não encontrado." }
              }

              /** Deletes only the selected commitment; no other schedule records are affected. */
              fun deleteAppointment(appointmentId: Long) {
                  val removed = writableDatabase.delete("appointments", "id=?", arrayOf(appointmentId.toString()))
                  require(removed == 1) { "Compromisso não encontrado." }
              }

              /** Renames the app catalog entry only; the original SAF document is never modified. */'''.replace('              ', '    '), 'appointment CRUD database methods')
          t = replace(t, '    var selectedDay by rememberSaveable { mutableStateOf(today()) }\n', '    var selectedDay by rememberSaveable { mutableStateOf(today()) }\n    var selectedAppointment by rememberSaveable { mutableLongStateOf(-1L) }\n', 'selected appointment state')
          t = replace(t, '    fun commit(next: String? = null, operation: () -> Unit) {', '    fun commit(next: String? = null, onSuccess: (() -> Unit)? = null, operation: () -> Unit) {', 'post-save callback signature')
          t = replace(t, '                data = fresh\n                if (next != null) afterSave(next)', '                data = fresh\n                onSuccess?.invoke()\n                if (next != null) afterSave(next)', 'post-save callback invoked only after successful transaction')
          t = replace(t, '"agenda" -> AgendaScreen(snapshot, selectedDay, { selectedDay = it }, { navigate("newAppointment") })\n                    "newAppointment" -> AppointmentForm(selectedDay, { back() }, { title, day, time -> commit("agenda") { store.addAppointment(title, day, time) } })', '''"agenda" -> AgendaScreen(snapshot, selectedDay, { selectedDay = it }, { navigate("newAppointment") }, { appointmentId ->
                        selectedAppointment = appointmentId
                        navigate("editAppointment")
                    })
                    "newAppointment" -> AppointmentForm(selectedDay, { back() }, { title, day, time ->
                        commit("agenda", onSuccess = { selectedDay = day }) { store.addAppointment(title, day, time) }
                    })
                    "editAppointment" -> snapshot.appointments.firstOrNull { it.id == selectedAppointment }?.let { appointment ->
                        AppointmentForm(appointment.date, { back() }, { title, day, time ->
                            commit("agenda", onSuccess = { selectedDay = day }) { store.updateAppointment(appointment.id, title, day, time) }
                        }, initial = appointment, delete = { commit("agenda") { store.deleteAppointment(appointment.id) } })
                    }''', 'agenda navigation and working edit route')
          t = replace(t, '"newLesson", "observation", "newAppointment", "profile"', '"newLesson", "observation", "newAppointment", "editAppointment", "profile"', 'hide bottom tabs on appointment forms')
          old = '''@Composable private fun AgendaScreen(data: TeacherSnapshot, day: String, onDay: (String) -> Unit, add: () -> Unit) {
              Heading("Compromissos", "Organize sua rotina e foque no que importa")
              DaySwitch(day, onDay)
              Subtitle("Agenda do dia")
              val events = data.appointments.filter { it.date == day }
              if (events.isEmpty()) Panel { Text("Nenhum compromisso para esta data.", color = ink) }
              events.forEach { item -> ActionTile("⏰", item.title, item.time) {} }
              Spacer(Modifier.height(12.dp))
              PrimaryButton("+ Novo compromisso", click = add)
          }

          @Composable private fun AppointmentForm(initialDay: String, back: () -> Unit, save: (String, String, String) -> Unit) {
              var title by rememberSaveable { mutableStateOf("") }
              var day by rememberSaveable { mutableStateOf(initialDay) }
              var time by rememberSaveable { mutableStateOf("08:00") }
              Heading("Novo compromisso", "Adicione um item à sua agenda", back)
              Panel {
                  Input("Título do compromisso", title, { title = it })
                  Input("Data (AAAA-MM-DD)", day, { day = it })
                  Input("Horário (HH:MM)", time, { time = it })
                  PrimaryButton("Salvar compromisso") { save(title, day, time) }
              }
          }
          '''.replace('          ', '')
          new = '''@Composable private fun AgendaScreen(data: TeacherSnapshot, day: String, onDay: (String) -> Unit, add: () -> Unit, open: (Long) -> Unit) {
              Heading("Compromissos", "Organize sua rotina e foque no que importa")
              DaySwitch(day, onDay)
              Subtitle("Agenda do dia")
              val events = data.appointments.filter { it.date == day }
              if (events.isEmpty()) Panel { Text("Nenhum compromisso para esta data.", color = ink) }
              events.forEach { item -> ActionTile("⏰", item.title, item.time) { open(item.id) } }
              Spacer(Modifier.height(12.dp))
              PrimaryButton("+ Novo compromisso", click = add)
          }

          @Composable private fun AppointmentForm(initialDay: String, back: () -> Unit, save: (String, String, String) -> Unit,
                                                   initial: Appointment? = null, delete: (() -> Unit)? = null) {
              var title by rememberSaveable(initial?.id) { mutableStateOf(initial?.title.orEmpty()) }
              var day by rememberSaveable(initial?.id) { mutableStateOf(initial?.date ?: initialDay) }
              var time by rememberSaveable(initial?.id) { mutableStateOf(initial?.time ?: "08:00") }
              var confirmDeletion by remember { mutableStateOf(false) }
              Heading(if (initial == null) "Novo compromisso" else "Editar compromisso", "Organize sua agenda", back)
              Panel {
                  Input("Título do compromisso", title, { title = it })
                  Input("Data (AAAA-MM-DD)", day, { day = it })
                  Input("Horário (HH:MM)", time, { time = it })
                  PrimaryButton(if (initial == null) "Salvar compromisso" else "Salvar alterações") { save(title, day, time) }
                  if (delete != null) {
                      Spacer(Modifier.height(12.dp))
                      PrimaryButton("Excluir compromisso", secondary = true) { confirmDeletion = true }
                  }
              }
              if (confirmDeletion && delete != null) AlertDialog(
                  onDismissRequest = { confirmDeletion = false },
                  title = { Text("Excluir compromisso?") },
                  text = { Text("Esta exclusão é permanente e afeta somente este compromisso.") },
                  confirmButton = { TextButton(onClick = { confirmDeletion = false; delete() }) { Text("Excluir definitivamente") } },
                  dismissButton = { TextButton(onClick = { confirmDeletion = false }) { Text("Cancelar") } }
              )
          }
          '''.replace('          ', '')
          t = replace(t, old, new, 'agenda actionable cards and confirmed edit/delete form')
          store.write_text(s)
          ui.write_text(t)
          print('Updated TeacherStore.kt and TeacherApp.kt with strict anchor checks')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/data/TeacherStore.kt app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt
          git rm -f .github/workflows/one-shot-agenda-crud.yml
          git commit -m 'feat(agenda): implement persistent appointment edit and confirmed deletion'
          git push origin HEAD:feat/1-android-bootstrap
