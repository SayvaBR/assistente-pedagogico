name: One-shot Home privacy integration (self-cleaning)
on:
  push:
    branches: [feat/12-files-organization]
    paths:
      - .github/workflows/one-shot-home-privacy.yml
permissions:
  contents: write
concurrency:
  group: one-shot-home-privacy
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'SayvaBR/assistente-pedagogico' && github.ref == 'refs/heads/feat/12-files-organization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/12-files-organization
          persist-credentials: true
      - name: Guard original file, patch exactly once, self-delete and push without force
        shell: bash
        run: |
          set -euo pipefail
          target=app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt
          test "$(git hash-object "$target")" = '5cdd675c27d2a2dacb80bd306af05c3527057382'
          test -f app/src/main/java/com/sayvabr/assistentepedagogico/ui/HomeContentPolicy.kt
          test -f app/src/androidTest/java/com/sayvabr/assistentepedagogico/ui/HomeContentPolicyInstrumentedTest.kt
          python3 tools/one_shot_home_privacy.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm tools/one_shot_home_privacy.py .github/workflows/one-shot-home-privacy.yml
          git commit -m 'fix(home): isolate classroom records and disambiguate class picker'
          git push origin HEAD:refs/heads/feat/12-files-organization
