name: One-shot observation isolation fix
on:
  push:
    branches: [feat/10-files-visual-foundation]
    paths:
      - .github/workflows/one-shot-observation-isolation.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/10-files-visual-foundation
          persist-credentials: true
      - name: Apply guarded fix and remove one-shot helper
        run: |
          set -euo pipefail
          python3 tools/one_shot_fix_observation_isolation.py
          git diff --check
          git rm .github/workflows/one-shot-observation-isolation.yml tools/one_shot_fix_observation_isolation.py
          git add app/src/main/java/com/sayvabr/assistentepedagogico/data/TeacherStore.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(data): reject observation links to students in other classes'
          git push origin HEAD:feat/10-files-visual-foundation
