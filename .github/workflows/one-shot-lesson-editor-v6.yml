name: One-shot lesson editor v6
on:
  push:
    branches: [feat/14-navigation-visual-integration]
    paths:
      - .github/workflows/one-shot-lesson-editor-v6.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/14-navigation-visual-integration
          persist-credentials: true
      - name: Apply guarded routing and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt)" = '4a7eacad9359f3f808544d20cb3cb94fa502b8e5'
          python3 tools/one_shot_lesson_editor_v6.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt
          git rm tools/one_shot_lesson_editor_v6.py .github/workflows/one-shot-lesson-editor-v6.yml
          git commit -m 'feat(planning): connect rich lesson editor v6'
          git push origin HEAD:refs/heads/feat/14-navigation-visual-integration