name: One-shot attendance history navigation
on:
  push:
    branches: [feat/1-android-bootstrap]
    paths: [.github/workflows/one-shot-attendance-history.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-android-bootstrap
          persist-credentials: true
      - name: Integrate history and repair empty-attendance action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt')
          src = p.read_text()
          def patch(old, new, description):
              global src
              count = src.count(old)
              if count != 1: raise RuntimeError(f'{description}: expected one anchor; found {count}')
              src = src.replace(old, new, 1)
              print(f'Applied: {description}')
          old = '                    "attendance" -> if (currentClass != null) AttendanceEditor('
          new = '''                    "attendanceHistory" -> if (currentClass != null) AttendanceHistoryScreen(
                        snapshot, currentClass, back = { back() },
                        openDay = { day -> selectedDay = day; navigate("attendance") },
                        startAttendance = { selectedDay = today(); navigate("attendance") }
                    )
                    "attendance" -> if (currentClass != null) AttendanceEditor('''
          patch(old, new, 'history route')
          old = 'onBack = { back() }, onSave = { marks -> commit("classDetail") { store.saveAttendance(currentClass.id, selectedDay, marks) } })'
          new = 'onBack = { back() }, onAddStudent = { navigate("addStudent") }, onSave = { marks -> commit("classDetail") { store.saveAttendance(currentClass.id, selectedDay, marks) } })'
          patch(old, new, 'attendance add student navigation')
          old = '    ActionTile("✓", "Frequência", "Registrar presenças e faltas") { go("attendance") }'
          new = old + '\n    ActionTile("▦", "Histórico de frequência", "Consultar e corrigir chamadas anteriores") { go("attendanceHistory") }'
          patch(old, new, 'class detail action')
          old = 'onBack: () -> Unit, onSave: (Map<Long, String>) -> Unit) {'
          new = 'onBack: () -> Unit, onAddStudent: () -> Unit, onSave: (Map<Long, String>) -> Unit) {'
          patch(old, new, 'attendance editor callback signature')
          patch('PrimaryButton("Adicionar alunos", click = onBack)', 'PrimaryButton("Adicionar alunos", click = onAddStudent)', 'empty attendance CTA')
          p.write_text(src)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt
          git rm -f .github/workflows/one-shot-attendance-history.yml
          git commit -m 'feat(attendance): wire history and correct empty-state student action'
          git push origin HEAD:feat/1-android-bootstrap
