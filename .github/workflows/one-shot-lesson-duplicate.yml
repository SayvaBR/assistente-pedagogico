name: One-shot guarded lesson duplication integration
on:
  push:
    branches:
      - feat/14-navigation-visual-integration
    paths:
      - .github/workflows/one-shot-lesson-duplicate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/14-navigation-visual-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/14-navigation-visual-integration
          persist-credentials: true
      - name: Patch verified anchors and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/one_shot_lesson_duplicate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt app/src/main/java/com/sayvabr/assistentepedagogico/ui/LessonEditorV6.kt tools/one_shot_lesson_duplicate.py .github/workflows/one-shot-lesson-duplicate.yml
          git diff --cached --check
          git commit -m 'feat(planning): expose atomic duplicate action in lesson editor'
          git push origin HEAD:feat/14-navigation-visual-integration
