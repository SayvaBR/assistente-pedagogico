name: One-shot observation history wiring
on:
  push:
    branches: [feat/10-files-visual-foundation]
    paths:
      - .github/workflows/one-shot-wire-observation-history.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/10-files-visual-foundation
          persist-credentials: true
      - name: Apply checked patch and remove one-shot files
        run: |
          set -euo pipefail
          python3 tools/one_shot_wire_observation_history.py
          git diff --check
          git rm .github/workflows/one-shot-wire-observation-history.yml tools/one_shot_wire_observation_history.py
          git add app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt app/src/main/java/com/sayvabr/assistentepedagogico/ui/ObservationHistoryScreen.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(records): connect searchable history to class details and edit flows'
          git push origin HEAD:feat/10-files-visual-foundation
