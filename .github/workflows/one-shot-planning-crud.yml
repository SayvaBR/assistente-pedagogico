name: One-shot planning implementation
on:
  push:
    branches: [feat/1-android-bootstrap]
    paths: [.github/workflows/one-shot-planning-crud.yml]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-android-bootstrap
          persist-credentials: true
      - name: Apply guarded planning patch and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          store = Path('app/src/main/java/com/sayvabr/assistentepedagogico/data/TeacherStore.kt')
          ui = Path('app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt')
          tests = Path('app/src/androidTest/java/com/sayvabr/assistentepedagogico/data/TeacherStoreInstrumentedTest.kt')
          s, t, a = store.read_text(), ui.read_text(), tests.read_text()
          def one(src, old, new, label):
              count = src.count(old)
              if count != 1: raise RuntimeError(f'{label}: expected one anchor, found {count}')
              print('PATCH:', label)
              return src.replace(old, new, 1)
          def between(src, start, end, new, label, guard):
              if src.count(start) != 1 or src.count(end) != 1: raise RuntimeError(f'{label}: missing/ambiguous boundaries')
              pos = src.index(start); stop = src.index(end, pos)
              old = src[pos:stop]
              if guard not in old: raise RuntimeError(f'{label}: unexpected existing implementation')
              print('PATCH:', label)
              return src[:pos] + new + src[stop:]
          s = one(s, 'data class Lesson(val id: Long, val classroomId: Long, val title: String, val subject: String, val date: String, val time: String, val objective: String, val content: String, val method: String)', 'data class Lesson(val id: Long, val classroomId: Long, val title: String, val subject: String, val date: String, val time: String, val objective: String, val content: String, val method: String, val archived: Boolean = false)', 'lesson model archived flag')
          s = one(s, '"pedagogico.db", null, 2)', '"pedagogico.db", null, 3)', 'database version 3')
          s = one(s, 'method TEXT NOT NULL)\",', 'method TEXT NOT NULL, archived INTEGER NOT NULL DEFAULT 0)\",', 'new lesson archive column')
          migration = '''    override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
              require(oldVersion in 1..2 && newVersion == 3) { "Unsupported database migration from $oldVersion to $newVersion" }
              if (oldVersion < 2) db.execSQL("ALTER TABLE classrooms ADD COLUMN archived INTEGER NOT NULL DEFAULT 0")
              if (oldVersion < 3) db.execSQL("ALTER TABLE lessons ADD COLUMN archived INTEGER NOT NULL DEFAULT 0")
          }

          '''.replace('          ', '')
          s = between(s, '    override fun onUpgrade(', '    fun read(): TeacherSnapshot {', migration, 'non-destructive migrations v1/v2 to v3', 'ALTER TABLE classrooms')
          s = one(s, 'SELECT id,classroom_id,title,subject,day,time,objective,content,method FROM lessons', 'SELECT id,classroom_id,title,subject,day,time,objective,content,method,archived FROM lessons', 'read archived plans')
          s = one(s, 'c.getString(7), c.getString(8)) }\n        val attendance', 'c.getString(7), c.getString(8), c.getInt(9) == 1) }\n        val attendance', 'decode archived plans')
          lesson_methods = '''    fun saveLesson(classroomId: Long, title: String, subject: String, date: String, time: String, objective: String, content: String, method: String) {
              require(title.isNotBlank() && subject.isNotBlank() && objective.isNotBlank()) { "Preencha o título, a disciplina e o objetivo." }
              LocalDate.parse(date)
              LocalTime.parse(time)
              writableDatabase.insertOrThrow("lessons", null, values("classroom_id" to classroomId, "title" to title.trim(), "subject" to subject.trim(), "day" to date, "time" to time, "objective" to objective.trim(), "content" to content.trim(), "method" to method.trim()))
          }

              /** Edits only a plan belonging to the selected classroom; keeps its ID and other records untouched. */
              fun updateLesson(classroomId: Long, lessonId: Long, title: String, subject: String, date: String, time: String, objective: String, content: String, method: String) {
                  require(title.isNotBlank() && subject.isNotBlank() && objective.isNotBlank()) { "Preencha o título, a disciplina e o objetivo." }
                  LocalDate.parse(date)
                  LocalTime.parse(time)
                  val changed = writableDatabase.update("lessons", values("title" to title.trim(), "subject" to subject.trim(), "day" to date, "time" to time, "objective" to objective.trim(), "content" to content.trim(), "method" to method.trim()), "id=? AND classroom_id=? AND archived=0", arrayOf(lessonId.toString(), classroomId.toString()))
                  require(changed == 1) { "Plano não encontrado nesta turma ou está arquivado." }
              }

              /** Reversible archival preserves the lesson, classroom and all historical data. */
              fun setLessonArchived(classroomId: Long, lessonId: Long, archived: Boolean) {
                  val changed = writableDatabase.update("lessons", values("archived" to archived), "id=? AND classroom_id=?", arrayOf(lessonId.toString(), classroomId.toString()))
                  require(changed == 1) { "Plano não encontrado nesta turma." }
              }

          '''.replace('          ', '')
          s = between(s, '    fun saveLesson(', '    fun saveAttendance(', lesson_methods, 'lesson save/edit/archive methods', 'writableDatabase.insertOrThrow("lessons"')
          t = one(t, '    var selectedAppointment by rememberSaveable { mutableLongStateOf(-1L) }', '    var selectedAppointment by rememberSaveable { mutableLongStateOf(-1L) }\n    var selectedLesson by rememberSaveable { mutableLongStateOf(-1L) }', 'selected plan state')
          t = one(t, '                    "planning" -> PlanningScreen(snapshot, currentClass, selectedDay, { selectedDay = it }, { navigate(it) })\n                    "newLesson" -> if (currentClass != null) LessonForm(currentClass, selectedDay, { back() }, { title, subject, day, time, objective, content, method -> commit("planning") { store.saveLesson(currentClass.id, title, subject, day, time, objective, content, method) } })', '''                    "planning" -> PlanningScreen(snapshot, currentClass, selectedDay, { selectedDay = it }, { navigate(it) },
                        openLesson = { lessonId -> selectedLesson = lessonId; navigate("editLesson") },
                        restoreLesson = { lesson -> commit("planning") { store.setLessonArchived(lesson.classroomId, lesson.id, false) } })
                    "newLesson" -> if (currentClass != null) LessonForm(currentClass, selectedDay, { back() }, { title, subject, day, time, objective, content, method ->
                        commit("planning", onSuccess = { selectedDay = day }) { store.saveLesson(currentClass.id, title, subject, day, time, objective, content, method) }
                    })
                    "editLesson" -> snapshot.lessons.firstOrNull { it.id == selectedLesson && !it.archived }?.let { lesson ->
                        snapshot.classrooms.firstOrNull { it.id == lesson.classroomId && !it.archived }?.let { lessonClass ->
                            LessonForm(lessonClass, lesson.date, { back() }, { title, subject, day, time, objective, content, method ->
                                commit("planning", onSuccess = { selectedDay = day }) { store.updateLesson(lessonClass.id, lesson.id, title, subject, day, time, objective, content, method) }
                            }, initial = lesson, archive = { commit("planning") { store.setLessonArchived(lessonClass.id, lesson.id, true) } })
                        }
                    } ?: Panel { Text("Plano indisponível. Retorne ao Planejamento.", color = ink); PrimaryButton("Voltar ao planejamento") { navigate("planning", root = true) } }''', 'working planning routes')
          t = one(t, '"newLesson", "observation", "newAppointment", "editAppointment"', '"newLesson", "editLesson", "observation", "newAppointment", "editAppointment"', 'hide bottom tabs while editing lesson')
          planning = '''@Composable private fun PlanningScreen(data: TeacherSnapshot, classroom: Classroom?, day: String, onDay: (String) -> Unit,
                  go: (String) -> Unit, openLesson: (Long) -> Unit, restoreLesson: (Lesson) -> Unit) {
              Heading("Planejamento", "Suas aulas por dia, semana e mês")
              var view by rememberSaveable { mutableStateOf("Dia") }
              Choices(listOf("Dia", "Semana", "Mês", "Arquivados"), view) { view = it }
              val focus = LocalDate.parse(day)
              val start = when (view) {
                  "Semana" -> focus.minusDays((focus.dayOfWeek.value - 1).toLong())
                  "Mês" -> focus.withDayOfMonth(1)
                  else -> focus
              }
              val end = when (view) {
                  "Semana" -> start.plusDays(6)
                  "Mês" -> start.plusMonths(1).minusDays(1)
                  else -> focus
              }
              if (view == "Dia") DaySwitch(day, onDay)
              else if (view != "Arquivados") {
                  Panel {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          Text("‹", Modifier.clickable { onDay(if (view == "Semana") focus.minusWeeks(1).toString() else focus.minusMonths(1).toString()) }.padding(6.dp), color = blue, fontSize = 29.sp)
                          Text(if (view == "Semana") "${start.format(DateTimeFormatter.ofPattern("dd/MM"))} – ${end.format(DateTimeFormatter.ofPattern("dd/MM/yyyy"))}"
                               else start.format(DateTimeFormatter.ofPattern("MMMM yyyy", Locale("pt", "BR"))).replaceFirstChar { it.uppercase() },
                               color = ink, fontWeight = FontWeight.ExtraBold, fontSize = 14.sp)
                          Text("›", Modifier.clickable { onDay(if (view == "Semana") focus.plusWeeks(1).toString() else focus.plusMonths(1).toString()) }.padding(6.dp), color = blue, fontSize = 29.sp)
                      }
                  }
                  Spacer(Modifier.height(14.dp))
              }
              val lessons = data.lessons.filter { lesson ->
                  lesson.classroomId == classroom?.id && if (view == "Arquivados") lesson.archived
                  else !lesson.archived && lesson.date >= start.toString() && lesson.date <= end.toString()
              }.sortedWith(compareBy<Lesson> { it.date }.thenBy { it.time })
              Subtitle(if (view == "Arquivados") "Planos arquivados (${lessons.size})" else "${lessons.size} aula(s) neste período")
              if (classroom == null) Panel { Text("Crie ou restaure uma turma para consultar seus planos.", color = ink) }
              else if (lessons.isEmpty()) Panel { Text(if (view == "Arquivados") "Nenhum plano arquivado nesta turma." else "Nenhum plano neste período. Use o botão abaixo para planejar sua próxima aula.", color = ink) }
              lessons.forEach { lesson ->
                  Panel {
                      Text("${lesson.date} • ${lesson.time} • ${lesson.subject}", fontSize = 13.sp, color = blue, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(6.dp))
                      Text(lesson.title, fontSize = 19.sp, color = ink, fontWeight = FontWeight.Black)
                      Spacer(Modifier.height(9.dp))
                      Text("Objetivo: ${lesson.objective}", fontSize = 14.sp, color = ink)
                      if (lesson.content.isNotEmpty()) Text("Conteúdo: ${lesson.content}", fontSize = 13.sp, color = ink)
                      if (lesson.method.isNotEmpty()) Text("Metodologia: ${lesson.method}", fontSize = 13.sp, color = ink)
                      Spacer(Modifier.height(12.dp))
                      if (lesson.archived) PrimaryButton("Restaurar plano") { restoreLesson(lesson) }
                      else PrimaryButton("Abrir e editar plano") { openLesson(lesson.id) }
                  }
                  Spacer(Modifier.height(9.dp))
              }
              Spacer(Modifier.height(12.dp))
              if (classroom != null && view != "Arquivados") PrimaryButton("+ Adicionar aula") { go("newLesson") }
          }

          @Composable private fun LessonForm(classroom: Classroom, initialDay: String, back: () -> Unit,
              save: (String, String, String, String, String, String, String) -> Unit,
              initial: Lesson? = null, archive: (() -> Unit)? = null) {
              var title by rememberSaveable(initial?.id) { mutableStateOf(initial?.title.orEmpty()) }
              var subject by rememberSaveable(initial?.id) { mutableStateOf(initial?.subject.orEmpty()) }
              var day by rememberSaveable(initial?.id) { mutableStateOf(initial?.date ?: initialDay) }
              var time by rememberSaveable(initial?.id) { mutableStateOf(initial?.time ?: "08:00") }
              var objective by rememberSaveable(initial?.id) { mutableStateOf(initial?.objective.orEmpty()) }
              var content by rememberSaveable(initial?.id) { mutableStateOf(initial?.content.orEmpty()) }
              var method by rememberSaveable(initial?.id) { mutableStateOf(initial?.method.orEmpty()) }
              var confirmArchive by remember { mutableStateOf(false) }
              Heading(if (initial == null) "Novo plano de aula" else "Editar plano de aula", classroom.name, back)
              Panel {
                  Input("Título da aula", title, { title = it })
                  Input("Disciplina / componente curricular", subject, { subject = it })
                  Input("Data (AAAA-MM-DD)", day, { day = it })
                  Input("Horário (HH:MM)", time, { time = it })
                  Input("Objetivo da aula", objective, { objective = it }, multiline = true)
                  Input("Conteúdo / objeto de conhecimento", content, { content = it }, multiline = true)
                  Input("Metodologia", method, { method = it }, multiline = true)
                  PrimaryButton(if (initial == null) "Salvar plano de aula" else "Salvar alterações") { save(title, subject, day, time, objective, content, method) }
                  if (archive != null) {
                      Spacer(Modifier.height(12.dp))
                      PrimaryButton("Arquivar plano", secondary = true) { confirmArchive = true }
                  }
              }
              if (confirmArchive && archive != null) AlertDialog(
                  onDismissRequest = { confirmArchive = false },
                  title = { Text("Arquivar plano?") },
                  text = { Text("O plano será preservado e poderá ser restaurado em Planejamento > Arquivados.") },
                  confirmButton = { TextButton(onClick = { confirmArchive = false; archive() }) { Text("Arquivar") } },
                  dismissButton = { TextButton(onClick = { confirmArchive = false }) { Text("Cancelar") } }
              )
          }

          '''.replace('          ', '')
          t = between(t, '@Composable private fun PlanningScreen(', '@Composable private fun AgendaScreen(', planning, 'day/week/month and editable plans UI', 'PrimaryButton("+ Adicionar aula")')
          regression = '''    @Test fun lessonEditAndArchiveRestorePreserveIdentityAndClassIsolation() {
                  val first = db()
                  val a = first.createClass("Turma A", "Ensino Fundamental", "Matutino")
                  val b = first.createClass("Turma B", "Ensino Médio", "Vespertino")
                  first.saveLesson(a, "Plano original", "História", "2026-09-16", "08:00", "Aprender", "Tema", "Discussão")
                  val original = first.read().lessons.single()
                  rejects { first.updateLesson(b, original.id, "Indevido", "História", "2026-09-17", "10:00", "Aprender", "Tema", "Discussão") }
                  rejects { first.setLessonArchived(b, original.id, true) }
                  assertEquals("Plano original", first.read().lessons.single().title)
                  first.updateLesson(a, original.id, "Plano revisado", "Geografia", "2026-09-18", "09:30", "Pesquisar", "Mapas", "Pesquisa de campo")
                  var saved = reopen().read().lessons.single()
                  assertEquals(original.id, saved.id)
                  assertEquals("Plano revisado", saved.title)
                  assertEquals("Geografia", saved.subject)
                  assertEquals("2026-09-18", saved.date)
                  assertEquals("09:30", saved.time)
                  assertFalse(saved.archived)
                  db().setLessonArchived(a, original.id, true)
                  saved = reopen().read().lessons.single()
                  assertTrue(saved.archived)
                  rejects { db().updateLesson(a, original.id, "Inválido", "Geografia", "2026-09-18", "09:30", "Pesquisar", "Mapas", "Pesquisa") }
                  db().setLessonArchived(a, original.id, false)
                  saved = reopen().read().lessons.single()
                  assertFalse(saved.archived)
                  assertEquals("Plano revisado", saved.title)
                  assertEquals(original.id, saved.id)
              }

              @Test fun migrationV2ToV3KeepsLessonAndAddsArchiveFlag() {
                  val file = context.getDatabasePath("pedagogico.db")
                  file.parentFile?.mkdirs()
                  SQLiteDatabase.openOrCreateDatabase(file, null).use { old ->
                      TeacherStore(context).onCreate(old)
                      old.execSQL("DROP TABLE lessons")
                      old.execSQL("CREATE TABLE lessons (id INTEGER PRIMARY KEY AUTOINCREMENT, classroom_id INTEGER NOT NULL REFERENCES classrooms(id) ON DELETE CASCADE, title TEXT NOT NULL, subject TEXT NOT NULL, day TEXT NOT NULL, time TEXT NOT NULL, objective TEXT NOT NULL, content TEXT NOT NULL, method TEXT NOT NULL)")
                      old.execSQL("INSERT INTO classrooms (id,name,stage,shift,archived) VALUES (1,'Turma v2','Educação Infantil','Matutino',0)")
                      old.execSQL("INSERT INTO lessons (classroom_id,title,subject,day,time,objective,content,method) VALUES (1,'Plano v2','Linguagem','2026-09-16','08:00','Objetivo','Conteúdo','Método')")
                      old.version = 2
                  }
                  val migrated = db().read()
                  assertEquals("Plano v2", migrated.lessons.single().title)
                  assertFalse(migrated.lessons.single().archived)
                  db().setLessonArchived(1L, migrated.lessons.single().id, true)
                  assertTrue(reopen().read().lessons.single().archived)
              }

          '''.replace('          ', '')
          a = one(a, '    @Test fun migrationV1ToV2PreservesEveryExistingTable() {', regression + '    @Test fun migrationV1ToV2PreservesEveryExistingTable() {', 'plan CRUD and v2 migration instrumented tests')
          a = one(a, 'assertEquals("Aula antiga", migrated.lessons.single().title)', 'assertEquals("Aula antiga", migrated.lessons.single().title)\n        assertFalse(migrated.lessons.single().archived)', 'assert v1->v3 lesson preservation')
          store.write_text(s); ui.write_text(t); tests.write_text(a)
          print('Planning patch applied. Changed:', len(s), len(t), len(a))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/data/TeacherStore.kt app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt app/src/androidTest/java/com/sayvabr/assistentepedagogico/data/TeacherStoreInstrumentedTest.kt
          git rm -f .github/workflows/one-shot-planning-crud.yml
          git commit -m 'feat(planning): day week month views and persisted plan edit archive restore'
          git push origin HEAD:feat/1-android-bootstrap
