name: One-shot observation CRUD implementation
on:
  push:
    branches:
      - feat/1-android-bootstrap
    paths:
      - tools/apply_observation_crud.py
      - .github/workflows/one-shot-observation-crud.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-android-bootstrap
      - name: Apply guarded source patch
        run: python3 tools/apply_observation_crud.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/sayvabr/assistentepedagogico/data/TeacherStore.kt app/src/main/java/com/sayvabr/assistentepedagogico/ui/TeacherApp.kt app/src/androidTest/java/com/sayvabr/assistentepedagogico/data/TeacherStoreInstrumentedTest.kt
          git rm -f .github/workflows/one-shot-observation-crud.yml tools/apply_observation_crud.py
          git commit -m 'feat(records): add persistent observation edit and delete'
          git push origin HEAD:feat/1-android-bootstrap