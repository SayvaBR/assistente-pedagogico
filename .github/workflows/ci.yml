name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK API 37.0
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build, unit test, lint and compile instrumentation tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      # The owner explicitly requested ONE debug preview to review UI and navigation.
      # Do not publish a release/AAB, merge this draft PR, or claim product acceptance.
      # Upload the short-lived test APK only when build, unit tests, lint and test compilation pass.
      - name: Record preview build provenance
        if: success() && github.event_name == 'pull_request'
        run: |
          printf 'TEST PREVIEW ONLY — NOT FOR REAL STUDENT DATA OR PLAY STORE\nCommit: %s\n' "$GITHUB_SHA" > preview-build-info.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk >> preview-build-info.txt
      - name: Upload owner-requested debug preview
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: assistente-pedagogico-debug-preview-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            preview-build-info.txt
          if-no-files-found: error
          retention-days: 3
