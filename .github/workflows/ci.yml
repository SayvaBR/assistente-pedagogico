name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # CI must validate the PR branch HEAD, not an implicit test merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK API 37.0
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build, unit test, lint and compile instrumentation tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      # The owner explicitly requested a disposable PR #15 debug APK for real-device testing.
      # Refuse a wrong-commit binary and any missing/empty output; this is not a release.
      - name: Check APK and record build provenance
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 15
        env:
          head_sha: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          test "$(git rev-parse HEAD)" = "$head_sha"
          sha256sum "$apk"
      - name: Upload installable debug preview APK (3-day retention)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 15
        uses: actions/upload-artifact@v4
        with:
          name: assistente-pedagogico-preview-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
